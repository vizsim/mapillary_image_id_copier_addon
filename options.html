<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapillary Traffic Sign Copier - Einstellungen</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #333;
      border-bottom: 2px solid #4A90E2;
      padding-bottom: 10px;
    }
    .option {
      margin: 20px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    label {
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      cursor: pointer;
    }
    .description {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }
    input[type="radio"] {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      cursor: pointer;
    }
    .radio-group {
      margin-top: 10px;
    }
    .radio-group label {
      margin-bottom: 8px;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      background: #d4edda;
      color: #155724;
      border-radius: 4px;
      display: none;
    }
    .status.show {
      display: block;
    }
  </style>
</head>
<body>
  <h1>⚙️ Einstellungen</h1>
  
  <div class="option">
    <label>
      <input type="checkbox" id="autoOpenTab">
      <span>Traffic Sign Tool automatisch öffnen</span>
    </label>
    <div class="description">
      Wenn aktiviert, wird das OSM Traffic Sign Tool automatisch in einem neuen Tab geöffnet, 
      wenn ein Verkehrszeichen erkannt wurde.
    </div>
  </div>

  <div class="option">
    <h3 style="margin-top: 0;">Kopiertes Format</h3>
    <label>
      <input type="checkbox" id="includeMapillary">
      <span>mapillary={id} einbeziehen</span>
    </label>
    <div class="description" style="margin-top: 10px;">
      <label>
        <input type="checkbox" id="includeTrafficSign">
        <span>traffic_sign={code} einbeziehen</span>
      </label>
    </div>
    <div class="description" style="margin-top: 10px;">
      <label>
        <input type="checkbox" id="includeDirection">
        <span>traffic_sign:direction einbeziehen</span>
      </label>
    </div>
    <div class="radio-group" id="directionGroup" style="margin-top: 10px; margin-left: 30px;">
      <label>
        <input type="radio" name="direction" value="forward" id="directionForward">
        <span>forward (vorwärts)</span>
      </label>
      <label>
        <input type="radio" name="direction" value="backward" id="directionBackward">
        <span>backward (rückwärts)</span>
      </label>
    </div>
  </div>

  <div class="status" id="status">Einstellungen gespeichert!</div>

  <script src="options.js"></script>
</body>
</html>
